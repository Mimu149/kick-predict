name: Daten aktualisieren

on:
  schedule:
    - cron: "20 4 * * *"       # täglich ~05:20 dänische Zeit: kompletter Lauf
    - cron: "20 12 * * *"      # mittags: Quoten + Spielplan nachladen
    - cron: "*/30 10-22 * * *" # alle 30 Min.: Aufstellungen kurz vor Anpfiff
  workflow_dispatch:
    inputs:
      mode:
        description: "full = alles neu berechnen, lineups = nur Aufstellungen"
        default: full
        type: choice
        options: [full, lineups]
  push:
    branches: [main]
    paths: ["docs/**", "pipeline/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daten
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Historie-Cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: historie-${{ github.run_id }}
          restore-keys: historie-

      - run: pip install -r requirements.txt

      - name: Modus bestimmen
        id: mode
        run: |
          MODE=full
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "*/30 10-22 * * *" ]; then MODE=lineups; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MODE="${{ inputs.mode }}"; fi
          if [ "${{ github.event_name }}" = "push" ] && [ -f docs/data/matches.json ]; then MODE=none; fi
          if [ "${{ github.event.schedule }}" = "20 12 * * *" ]; then echo "ODDS_BUDGET=10" >> $GITHUB_ENV; fi
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "Modus: $MODE"

      - name: Prognosen berechnen
        if: steps.mode.outputs.mode == 'full'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python pipeline/build.py

      - name: Aufstellungen holen
        if: steps.mode.outputs.mode == 'lineups'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python pipeline/lineups.py

      - name: Daten speichern
        id: commit
        run: |
          git config user.name "kick-predict-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Daten aktualisiert $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: docs
      - id: deploy
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v4
