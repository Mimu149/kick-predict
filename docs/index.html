<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1210">
<meta name="description" content="Fußball-Prognosen mit Form, Heim/Auswärts, H2H, Derbys und Value-Tipps">
<title>Kick Predict</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">⚽</span><div><b>Kick Predict</b><small id="updated">lädt …</small></div></div>
  <button id="refresh" class="icon-btn" aria-label="Neu laden">↻</button>
</header>

<main id="view"></main>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-bg" data-close></div>
  <div class="sheet-body" role="dialog" aria-modal="true">
    <div class="sheet-grip" data-close></div>
    <div id="sheet-content"></div>
  </div>
</div>

<button id="couponBtn" class="fab" hidden>🧾<span id="couponCount">0</span></button>
<div id="toast" class="toast" hidden></div>

<nav class="tabs">
  <button data-tab="games" class="active"><span>📅</span><i>Spiele</i></button>
  <button data-tab="results"><span>✅</span><i>Ergebnisse</i></button>
  <button data-tab="picks"><span>🎯</span><i>Picks</i></button>
  <button data-tab="tables"><span>📊</span><i>Tabellen</i></button>
  <button data-tab="info"><span>ℹ️</span><i>Info</i></button>
</nav>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
